server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/your-cert.crt;
    ssl_certificate_key /etc/ssl/private/your-cert.key;

    client_max_body_size 250M;

    # Block scrapers, automated scripts, and AI bots
    if ($http_user_agent ~* (scrapy|curl|wget|python-requests|httpclient|libwww|httplib|urllib|Go-http-client|Java|Jakarta|Apache-HttpClient|Go-http|GPTBot|CCBot|ClaudeBot|bytespider|Barkrowler|Nmap|sqlmap|nikto|masscan|zgrab)) {
        return 403;
    }

    # DDoS & Slowloris Mitigations
    limit_conn conn_limit 50;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /api/\nDisallow: /search\nDisallow: /export\nDisallow: /download\n";
    }

    location ~ ^/(assets|favicon\.ico|_headers|.*\.(js|css|ico|png|jpg|svg|woff|woff2))$ {
        root /var/www/frontend/.output/public;
        expires 1y;
        access_log off;
    }

    location ~ ^/api/api/(.*)$ {
        rewrite ^/api/api/(.*)$ /api/$1 last;
    }

    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        limit_req zone=api_limit burst=15 nodelay;
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
